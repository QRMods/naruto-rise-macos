# The macOS defaults over the PC port's (upstream/naruto-rise-recomp/app/narutorise.toml).
# tools/build.py puts each key in place of the PC port's own; the rest are the PC port's.

# Keyboard and mouse: a Mac rarely has a gamepad connected.
mnk_mode = true
# A window rather than the whole screen.
fullscreen = false
# 30 FPS, the game's own rate: 60 with interpolation does not hold in Konoha on an M4.
frame_rate = 30
# Straight into the game, as before PC port v0.4.0: its settings menu opens in the
# game with F1 (fn+F1 on a MacBook keyboard). true brings back the setup screen.
show_startup_menu = false
# No "Compiling shaders" notice while the game prepares new shaders for Metal.
show_shader_indicator = false
